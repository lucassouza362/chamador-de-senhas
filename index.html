<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamador de Senhas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#0d1420; --panel:#16202f; --panel2:#1d2a3d; --borda:#2b3b52;
    --texto:#e8eef7; --suave:#8fa3bd;
    --azul:#2e7dd1; --azul2:#1f5fa8;
    --ambar:#e8a020; --ambar2:#c07f0a;
    --verde:#2fae6a; --vermelho:#d64545;
    font-size:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--texto);font-family:"Segoe UI",system-ui,Arial,sans-serif;min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px}
  .oculto{display:none !important}

  /* ---------- Home ---------- */
  #telaHome{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px}
  #telaHome h1{font-size:1.7rem;font-weight:600;letter-spacing:.02em}
  #telaHome p{color:var(--suave)}
  .cartoes{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
  .cartao{background:var(--panel);border:1px solid var(--borda);border-radius:14px;padding:28px 26px;width:230px;
    color:var(--texto);text-align:left;display:flex;flex-direction:column;gap:8px;transition:border-color .15s, transform .15s}
  .cartao:hover{border-color:var(--azul);transform:translateY(-2px)}
  .cartao .ic{font-size:1.9rem}
  .cartao b{font-size:1.05rem}
  .cartao span{color:var(--suave);font-size:.85rem;line-height:1.35}

  /* ---------- Atendente ---------- */
  #telaGuiche, #telaAtendente{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
  #telaGuiche h2{font-weight:600}
  .gradeGuiches{display:grid;grid-template-columns:repeat(5,74px);gap:12px}
  .gradeGuiches button{height:64px;font-size:1.3rem;font-weight:700;background:var(--panel2);color:var(--texto);border:1px solid var(--borda)}
  .gradeGuiches button:hover{border-color:var(--azul);background:#223350}
  .linkVoltar{background:none;color:var(--suave);text-decoration:underline;font-size:.9rem}

  #telaAtendente{gap:16px}
  #cabAtend{display:flex;align-items:center;gap:12px;color:var(--suave)}
  #cabAtend b{color:var(--texto);font-size:1.2rem}
  #ultimaAtend{background:var(--panel);border:1px solid var(--borda);border-radius:14px;padding:18px 40px;text-align:center;min-width:280px}
  #ultimaAtend .rot{color:var(--suave);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em}
  #ultimaAtend .num{font-size:4.2rem;font-weight:800;line-height:1.1}
  #ultimaAtend .tag{font-size:.85rem;font-weight:700;letter-spacing:.06em}
  .tagPri{color:var(--ambar)} .tagCom{color:var(--azul)}
  .botoesChamar{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .btnGrande{padding:26px 34px;font-size:1.25rem;font-weight:700;color:#fff;min-width:230px;
    display:flex;flex-direction:column;gap:6px;align-items:center}
  .btnGrande small{font-weight:500;font-size:.8rem;opacity:.85}
  #btnPrioridade{background:linear-gradient(180deg,var(--ambar),var(--ambar2))}
  #btnComum{background:linear-gradient(180deg,var(--azul),var(--azul2))}
  .btnGrande:disabled{opacity:.4;cursor:not-allowed}
  #btnRepetir{background:var(--panel2);color:var(--texto);border:1px solid var(--borda);padding:12px 26px;font-size:1rem}
  #avisoAtend{min-height:22px;color:var(--vermelho);font-weight:600}

  /* ---------- Painel (projetor) ---------- */
  #telaPainel{position:fixed;inset:0;background:#000;overflow:hidden}
  #areaSlides{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #areaSlides img{max-width:100%;max-height:100%;object-fit:contain}
  #marcaOcioso{color:#22344f;font-size:2rem;font-weight:600;letter-spacing:.05em;text-align:center}

  #colunaHist{position:absolute;top:0;right:0;bottom:0;width:220px;background:rgba(10,16,26,.88);
    border-left:1px solid var(--borda);display:flex;flex-direction:column;gap:10px;padding:16px 14px;z-index:5}
  #colunaHist h3{color:var(--suave);font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;text-align:center}
  .itemHist{background:var(--panel);border:1px solid var(--borda);border-radius:10px;padding:10px;text-align:center}
  .itemHist .n{font-size:2rem;font-weight:800}
  .itemHist .g{color:var(--suave);font-size:.8rem}
  .itemHist.pri .n{color:var(--ambar)}

  #overlayChamada{position:absolute;inset:0;right:220px;background:rgba(5,10,18,.96);z-index:8;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  #overlayChamada .rot{font-size:2.2vw;color:var(--suave);text-transform:uppercase;letter-spacing:.25em}
  #overlayChamada .tag{font-size:3vw;font-weight:800;letter-spacing:.1em}
  #overlayChamada .num{font-size:22vw;font-weight:900;line-height:1;animation:pulsa 1s ease-in-out infinite alternate}
  #overlayChamada .gui{font-size:5vw;font-weight:700;color:var(--texto);margin-top:1vw}
  @keyframes pulsa{from{transform:scale(1)}to{transform:scale(1.05)}}

  #barraPainel{position:absolute;top:0;left:0;right:220px;z-index:10;background:rgba(13,20,32,.95);
    border-bottom:1px solid var(--borda);display:flex;gap:10px;align-items:center;padding:10px 14px;flex-wrap:wrap;
    transform:translateY(-110%);transition:transform .25s}
  #barraPainel.visivel{transform:translateY(0)}
  #barraPainel button,#barraPainel select,#barraPainel input,#barraPainel label{font-size:.85rem}
  #barraPainel button{background:var(--panel2);color:var(--texto);border:1px solid var(--borda);padding:8px 12px;border-radius:8px}
  #barraPainel select{background:var(--panel2);color:var(--texto);border:1px solid var(--borda);padding:7px;border-radius:8px}
  #barraPainel .sep{width:1px;height:24px;background:var(--borda)}
  #barraPainel label{color:var(--suave);display:flex;align-items:center;gap:6px}

  /* ---------- Admin ---------- */
  #telaAdmin{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
  .caixaAdmin{background:var(--panel);border:1px solid var(--borda);border-radius:14px;padding:26px;min-width:320px;
    display:flex;flex-direction:column;gap:16px}
  .caixaAdmin h2{font-weight:600;font-size:1.15rem}
  .linhaStat{display:flex;justify-content:space-between;color:var(--suave)}
  .linhaStat b{color:var(--texto)}
  #btnReset{background:var(--vermelho);color:#fff;padding:14px;font-size:1rem;font-weight:700}
  #pinCampo{background:var(--panel2);border:1px solid var(--borda);border-radius:8px;color:var(--texto);
    padding:11px;font-size:1rem;width:100%;text-align:center;letter-spacing:.3em}
  #msgAdmin{min-height:20px;font-size:.9rem;text-align:center}
</style>
</head>
<body>

<!-- ===================== HOME ===================== -->
<div id="telaHome">
  <div style="text-align:center">
    <h1>Chamador de Senhas</h1>
    <p>Senhas físicas de 1 a 150 &nbsp;·&nbsp; 1 a 20 prioridade &nbsp;·&nbsp; 21 a 150 comum</p>
  </div>
  <div class="cartoes">
    <button class="cartao" onclick="irPara('guiche')">
      <span class="ic">🧑‍💼</span><b>Atendente</b>
      <span>Chamar a próxima senha prioritária ou comum a partir do guichê</span>
    </button>
    <button class="cartao" onclick="irPara('painel')">
      <span class="ic">📺</span><b>Painel</b>
      <span>Tela do projetor com voz, som de aviso e slides</span>
    </button>
    <button class="cartao" onclick="irPara('admin')">
      <span class="ic">⚙️</span><b>Administração</b>
      <span>Reiniciar o ciclo de senhas para o próximo dia</span>
    </button>
  </div>
</div>

<!-- ===================== ESCOLHA DE GUICHÊ ===================== -->
<div id="telaGuiche" class="oculto">
  <h2>Qual é o seu guichê?</h2>
  <div class="gradeGuiches" id="gradeGuiches"></div>
  <button class="linkVoltar" onclick="irPara('home')">Voltar</button>
</div>

<!-- ===================== ATENDENTE ===================== -->
<div id="telaAtendente" class="oculto">
  <div id="cabAtend">Guichê <b id="rotGuiche">1</b>
    <button class="linkVoltar" onclick="irPara('guiche')">trocar</button>
  </div>

  <div id="ultimaAtend">
    <div class="rot">Última senha chamada por você</div>
    <div class="num" id="numAtend">—</div>
    <div class="tag" id="tagAtend">&nbsp;</div>
  </div>

  <div class="botoesChamar">
    <button class="btnGrande" id="btnPrioridade" onclick="chamar('prioridade')">
      Chamar prioridade
      <small id="restPri">senhas 1 a 20</small>
    </button>
    <button class="btnGrande" id="btnComum" onclick="chamar('comum')">
      Chamar comum
      <small id="restCom">senhas 21 a 150</small>
    </button>
  </div>

  <button id="btnRepetir" onclick="repetir()">🔁 Repetir última chamada</button>
  <div id="avisoAtend"></div>
  <button class="linkVoltar" onclick="irPara('home')">Início</button>
</div>

<!-- ===================== PAINEL ===================== -->
<div id="telaPainel" class="oculto">
  <div id="areaSlides"><div id="marcaOcioso">Aguardando chamadas…</div></div>

  <div id="colunaHist">
    <h3>Últimas senhas</h3>
    <div id="listaHist"></div>
  </div>

  <div id="overlayChamada" class="oculto">
    <div class="rot">Senha</div>
    <div class="tag" id="ovTag"></div>
    <div class="num" id="ovNum">—</div>
    <div class="gui" id="ovGui"></div>
  </div>

  <div id="barraPainel">
    <button onclick="telaCheia()">⛶ Tela cheia</button>
    <span class="sep"></span>
    <label>Som
      <select id="selSom">
        <option value="dingdong">Ding-dong</option>
        <option value="sino">Sino</option>
        <option value="trinado">Trinado</option>
      </select>
    </label>
    <button onclick="tocarSom()">▶ Testar</button>
    <label><input type="checkbox" id="chkVoz" checked> Voz</label>
    <span class="sep"></span>
    <label>Slides
      <input type="file" id="arqSlides" accept="image/*,application/pdf" multiple>
    </label>
    <label>Intervalo
      <select id="selIntervalo">
        <option value="5">5 s</option>
        <option value="8" selected>8 s</option>
        <option value="12">12 s</option>
        <option value="20">20 s</option>
      </select>
    </label>
    <button id="btnSlides" onclick="alternarSlides()">▶ Iniciar slides</button>
    <span class="sep"></span>
    <button onclick="irPara('home')">✕ Sair</button>
  </div>
</div>

<!-- ===================== ADMIN ===================== -->
<div id="telaAdmin" class="oculto">
  <div class="caixaAdmin">
    <h2>⚙️ Administração</h2>
    <div class="linhaStat">Prioridade (1–20)<b id="stPri">—</b></div>
    <div class="linhaStat">Comum (21–150)<b id="stCom">—</b></div>
    <input type="password" id="pinCampo" class="oculto" placeholder="PIN" inputmode="numeric">
    <button id="btnReset" onclick="resetar()">Reiniciar ciclo de senhas</button>
    <div id="msgAdmin"></div>
  </div>
  <button class="linkVoltar" onclick="irPara('home')">Início</button>
</div>

<script>
/* ================================================================
   NAVEGAÇÃO
================================================================ */
const telas = ['home','guiche','atendente','painel','admin'];
let guiche = localStorage.getItem('guiche') || '';
let pinNecessario = false;

function irPara(t){
  telas.forEach(x => document.getElementById('tela' + x[0].toUpperCase() + x.slice(1)).classList.add('oculto'));
  document.getElementById('tela' + t[0].toUpperCase() + t.slice(1)).classList.remove('oculto');
  location.hash = t === 'home' ? '' : t;
  if (t === 'atendente') iniciarAtendente();
  if (t === 'painel') iniciarPainel(); else pararPainel();
  if (t === 'admin') atualizarAdmin();
}

(function montarGuiches(){
  const g = document.getElementById('gradeGuiches');
  for (let i = 1; i <= 10; i++){
    const b = document.createElement('button');
    b.textContent = i;
    b.onclick = () => { guiche = String(i); localStorage.setItem('guiche', guiche); irPara('atendente'); };
    g.appendChild(b);
  }
})();

/* ================================================================
   API
================================================================ */
async function api(metodo, corpo){
  const r = await fetch('/api/estado', {
    method: metodo,
    headers: { 'Content-Type': 'application/json' },
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  return r.json();
}

/* ================================================================
   ATENDENTE
================================================================ */
let pollAtend = null;

function iniciarAtendente(){
  document.getElementById('rotGuiche').textContent = guiche || '?';
  atualizarAtendente();
  clearInterval(pollAtend);
  pollAtend = setInterval(atualizarAtendente, 4000);
}

async function atualizarAtendente(){
  try{
    const e = await api('GET');
    pinNecessario = e.pinNecessario;
    const restPri = e.limites.maxPrioridade - e.prioridade;
    const restCom = e.limites.maxComum - e.comum;
    document.getElementById('restPri').textContent =
      restPri > 0 ? `última: ${e.prioridade || '—'} · restam ${restPri}` : 'esgotadas';
    document.getElementById('restCom').textContent =
      restCom > 0 ? `última: ${e.comum > 20 ? e.comum : '—'} · restam ${restCom}` : 'esgotadas';
    document.getElementById('btnPrioridade').disabled = restPri <= 0;
    document.getElementById('btnComum').disabled = restCom <= 0;

    const minha = (e.historico || []).find(c => String(c.guiche) === String(guiche));
    if (minha){
      document.getElementById('numAtend').textContent = minha.senha;
      const tag = document.getElementById('tagAtend');
      tag.textContent = minha.tipo === 'prioridade' ? 'PRIORIDADE' : 'COMUM';
      tag.className = 'tag ' + (minha.tipo === 'prioridade' ? 'tagPri' : 'tagCom');
    }
  }catch(err){ /* silencioso; tenta no próximo ciclo */ }
}

async function chamar(tipo){
  const aviso = document.getElementById('avisoAtend');
  aviso.textContent = '';
  try{
    const r = await api('POST', { acao: 'chamar', tipo, guiche });
    if (r.esgotado){
      aviso.textContent = tipo === 'prioridade'
        ? 'Todas as senhas prioritárias (1–20) já foram chamadas.'
        : 'Todas as senhas comuns (21–150) já foram chamadas.';
    }
    atualizarAtendente();
  }catch(err){ aviso.textContent = 'Falha de conexão. Tente novamente.'; }
}

async function repetir(){
  const aviso = document.getElementById('avisoAtend');
  aviso.textContent = '';
  try{
    const r = await api('POST', { acao: 'repetir', guiche });
    if (r.erro || r.ok === false) aviso.textContent = r.erro || 'Nada para repetir.';
  }catch(err){ aviso.textContent = 'Falha de conexão. Tente novamente.'; }
}

/* ================================================================
   PAINEL — fila de anúncios, voz, som, slides
================================================================ */
let pollPainel = null, ultimoId = null, filaAnuncios = [], anunciando = false;
let slides = [], idxSlide = 0, timerSlides = null, slidesAtivos = false;
let ctxAudio = null;

function iniciarPainel(){
  clearInterval(pollPainel);
  ultimoId = null; filaAnuncios = []; anunciando = false;
  cicloPainel();
  pollPainel = setInterval(cicloPainel, 2500);
}
function pararPainel(){
  clearInterval(pollPainel); pollPainel = null;
  clearInterval(timerSlides); timerSlides = null; slidesAtivos = false;
  const b = document.getElementById('btnSlides'); if (b) b.textContent = '▶ Iniciar slides';
}

async function cicloPainel(){
  try{
    const e = await api('GET');
    const hist = (e.historico || []).slice().sort((a,b) => a.id - b.id); // mais antigo → mais novo
    if (ultimoId === null){
      // primeira leitura: não anuncia o passado
      ultimoId = hist.length ? hist[hist.length - 1].id : 0;
    } else {
      for (const c of hist){
        if (c.id > ultimoId){ filaAnuncios.push(c); ultimoId = c.id; }
      }
    }
    desenharHistorico(hist);
    processarFila();
  }catch(err){ /* tenta no próximo ciclo */ }
}

function desenharHistorico(histAsc){
  const vistos = new Set(); const itens = [];
  for (let i = histAsc.length - 1; i >= 0 && itens.length < 3; i--){
    const c = histAsc[i];
    const chave = c.senha + '|' + c.guiche;
    if (!vistos.has(chave)){ vistos.add(chave); itens.push(c); }
  }
  document.getElementById('listaHist').innerHTML = itens.map(c => `
    <div class="itemHist ${c.tipo === 'prioridade' ? 'pri' : ''}">
      <div class="n">${c.senha}</div>
      <div class="g">Guichê ${c.guiche}</div>
    </div>`).join('');
}

function processarFila(){
  if (anunciando || filaAnuncios.length === 0) return;
  anunciando = true;
  const c = filaAnuncios.shift();

  document.getElementById('ovNum').textContent = c.senha;
  document.getElementById('ovGui').textContent = 'Guichê ' + c.guiche;
  const tag = document.getElementById('ovTag');
  const pri = c.tipo === 'prioridade';
  tag.textContent = pri ? 'PRIORIDADE' : '';
  tag.style.color = 'var(--ambar)';
  document.getElementById('overlayChamada').classList.remove('oculto');

  tocarSom();
  setTimeout(() => falar(c), 700);

  setTimeout(() => {
    document.getElementById('overlayChamada').classList.add('oculto');
    anunciando = false;
    processarFila(); // próxima da fila, se houver — nenhuma chamada é pulada
  }, 7000);
}

function falar(c){
  if (!document.getElementById('chkVoz').checked || !('speechSynthesis' in window)) return;
  const pri = c.tipo === 'prioridade';
  const texto = `Senha ${pri ? 'prioritária ' : ''}${c.senha}. Guichê ${c.guiche}.`;
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = 'pt-BR'; u.rate = 0.95;
  const voz = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('pt'));
  if (voz) u.voice = voz;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ---- Sons (WebAudio, sem arquivos externos) ---- */
function tocarSom(){
  if (!ctxAudio) ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
  if (ctxAudio.state === 'suspended') ctxAudio.resume();
  const tipo = document.getElementById('selSom').value;
  const t0 = ctxAudio.currentTime;
  const nota = (freq, ini, dur, vol = 0.35) => {
    const o = ctxAudio.createOscillator(), g = ctxAudio.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t0 + ini);
    g.gain.linearRampToValueAtTime(vol, t0 + ini + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + ini + dur);
    o.connect(g); g.connect(ctxAudio.destination);
    o.start(t0 + ini); o.stop(t0 + ini + dur + 0.05);
  };
  if (tipo === 'dingdong'){ nota(830, 0, 0.7); nota(660, 0.45, 0.9); }
  else if (tipo === 'sino'){ nota(1050, 0, 1.4, 0.4); nota(2100, 0, 0.5, 0.12); }
  else { nota(600, 0, 0.25); nota(800, 0.22, 0.25); nota(1000, 0.44, 0.5); }
}

/* ---- Barra de controle escondida ---- */
let timerBarra = null;
document.getElementById('telaPainel').addEventListener('mousemove', () => {
  const b = document.getElementById('barraPainel');
  b.classList.add('visivel');
  clearTimeout(timerBarra);
  timerBarra = setTimeout(() => b.classList.remove('visivel'), 3000);
});

function telaCheia(){
  const el = document.getElementById('telaPainel');
  if (!document.fullscreenElement) el.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}

/* ---- Slides: imagens e PDF ---- */
document.getElementById('arqSlides').addEventListener('change', async ev => {
  slides = []; idxSlide = 0;
  for (const f of ev.target.files){
    if (f.type === 'application/pdf'){
      try{
        const buf = await f.arrayBuffer();
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        for (let p = 1; p <= pdf.numPages; p++){
          const pag = await pdf.getPage(p);
          const vp = pag.getViewport({ scale: 1.6 });
          const cv = document.createElement('canvas');
          cv.width = vp.width; cv.height = vp.height;
          await pag.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
          slides.push(cv.toDataURL('image/jpeg', 0.85));
        }
      }catch(e){ /* PDF inválido: ignora */ }
    } else if (f.type.startsWith('image/')){
      slides.push(await new Promise(res => {
        const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f);
      }));
    }
  }
  document.getElementById('btnSlides').textContent =
    slides.length ? `▶ Iniciar slides (${slides.length})` : '▶ Iniciar slides';
});

function alternarSlides(){
  if (slidesAtivos){
    slidesAtivos = false; clearInterval(timerSlides);
    document.getElementById('btnSlides').textContent = '▶ Iniciar slides' + (slides.length ? ` (${slides.length})` : '');
    document.getElementById('areaSlides').innerHTML = '<div id="marcaOcioso">Aguardando chamadas…</div>';
    return;
  }
  if (!slides.length) return;
  slidesAtivos = true;
  document.getElementById('btnSlides').textContent = '⏸ Parar slides';
  mostrarSlide();
  timerSlides = setInterval(() => { idxSlide = (idxSlide + 1) % slides.length; mostrarSlide(); },
    Number(document.getElementById('selIntervalo').value) * 1000);
}
function mostrarSlide(){
  document.getElementById('areaSlides').innerHTML = `<img src="${slides[idxSlide]}" alt="">`;
}

/* ================================================================
   ADMIN
================================================================ */
async function atualizarAdmin(){
  document.getElementById('msgAdmin').textContent = '';
  try{
    const e = await api('GET');
    pinNecessario = e.pinNecessario;
    document.getElementById('stPri').textContent =
      `${e.prioridade} de ${e.limites.maxPrioridade} chamadas`;
    document.getElementById('stCom').textContent =
      `${Math.max(e.comum - e.limites.baseComum, 0)} de ${e.limites.maxComum - e.limites.baseComum} chamadas`;
    document.getElementById('pinCampo').classList.toggle('oculto', !pinNecessario);
  }catch(err){
    document.getElementById('msgAdmin').textContent = 'Falha ao carregar o estado.';
  }
}

async function resetar(){
  if (!confirm('Reiniciar o ciclo? A prioridade volta para a senha 1 e a comum para a 21.')) return;
  const msg = document.getElementById('msgAdmin');
  msg.style.color = '';
  try{
    const pin = pinNecessario ? document.getElementById('pinCampo').value : undefined;
    const r = await api('POST', { acao: 'reset', pin });
    if (r.erro){ msg.style.color = 'var(--vermelho)'; msg.textContent = r.erro; }
    else { msg.style.color = 'var(--verde)'; msg.textContent = 'Ciclo reiniciado.'; atualizarAdmin(); }
  }catch(err){ msg.style.color = 'var(--vermelho)'; msg.textContent = 'Falha de conexão.'; }
}

/* ---- Rota inicial por hash ---- */
(function(){
  const h = location.hash.replace('#','');
  if (h === 'atendente' && !guiche) irPara('guiche');
  else if (telas.includes(h)) irPara(h);
})();
if ('speechSynthesis' in window) speechSynthesis.getVoices();
</script>
